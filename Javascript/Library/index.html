<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal Library app to track books, page counts, and reading progress.">
  <title>The Library | Personal Reading Collection</title>

  <!-- Google Fonts: Newsreader & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="header-brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <div>
          <p class="eyebrow">Personal Reading Room</p>
          <h1 class="site-title">My Library</h1>
        </div>
      </div>

      <button type="button" id="new-book-btn" class="btn btn-primary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New Book
      </button>
    </header>

    <section class="library-controls" aria-label="Library overview and filters">
      <div class="stats-bar" aria-live="polite">
        <div class="stat-pill">
          <span class="stat-label">Books</span>
          <strong id="stat-total" class="stat-value">0</strong>
        </div>
        <div class="stat-pill">
          <span class="stat-label">Read</span>
          <strong id="stat-read" class="stat-value">0</strong>
        </div>
        <div class="stat-pill">
          <span class="stat-label">Unread</span>
          <strong id="stat-unread" class="stat-value">0</strong>
        </div>
        <div class="stat-pill">
          <span class="stat-label">Pages Read</span>
          <strong id="stat-pages-read" class="stat-value">0</strong>
        </div>
      </div>

      <div class="filter-group" role="group" aria-label="Filter books by reading status">
        <button type="button" class="filter-btn is-active" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="filter-btn" data-filter="read" aria-pressed="false">Read</button>
        <button type="button" class="filter-btn" data-filter="unread" aria-pressed="false">Unread</button>
      </div>
    </section>

    <main>
      <section id="library-grid" class="library-grid" aria-label="Book collection">
        <!-- Book cards rendered dynamically from myLibrary -->
      </section>
    </main>
  </div>

  <!-- Add New Book Dialog -->
  <dialog id="book-dialog" class="book-dialog" aria-labelledby="dialog-title">
    <form id="book-form" class="book-form" novalidate>
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Catalog Entry</p>
          <h2 id="dialog-title" class="dialog-title">Add a New Book</h2>
        </div>
        <button type="button" id="close-dialog-btn" class="icon-btn" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="form-fields">
        <div class="field">
          <label for="book-title">Title <span class="required-mark" aria-hidden="true">*</span></label>
          <input type="text" id="book-title" name="title" placeholder="e.g. The Left Hand of Darkness" maxlength="140" required>
          <p class="field-error" id="error-title" role="alert"></p>
        </div>

        <div class="field">
          <label for="book-author">Author <span class="required-mark" aria-hidden="true">*</span></label>
          <input type="text" id="book-author" name="author" placeholder="e.g. Ursula K. Le Guin" maxlength="100" required>
          <p class="field-error" id="error-author" role="alert"></p>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="book-pages">Pages <span class="required-mark" aria-hidden="true">*</span></label>
            <input type="number" id="book-pages" name="pages" placeholder="e.g. 304" min="1" max="50000" required>
            <p class="field-error" id="error-pages" role="alert"></p>
          </div>

          <div class="field">
            <label for="book-genre">Genre <span class="optional-mark">(Optional)</span></label>
            <input type="text" id="book-genre" name="genre" placeholder="e.g. Science Fiction" maxlength="40">
          </div>
        </div>

        <label class="checkbox-field" for="book-read">
          <input type="checkbox" id="book-read" name="read">
          <span class="checkbox-custom" aria-hidden="true"></span>
          <span>I have already read this book</span>
        </label>
      </div>

      <div class="dialog-actions">
        <button type="button" id="cancel-dialog-btn" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Add to Library</button>
      </div>
    </form>
  </dialog>
</body>
</html>
