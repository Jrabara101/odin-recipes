<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#FBC02D"/>
  <!-- Cat Body / Head -->
  <circle cx="50" cy="52" r="32" fill="#FFFFFF" stroke="#263238" stroke-width="2.5"/>
  <!-- Ears -->
  <polygon points="26,34 18,14 38,24" fill="#FFFFFF" stroke="#263238" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="27,31 22,18 35,25" fill="#FF80AB"/>
  <polygon points="74,34 82,14 62,24" fill="#FFFFFF" stroke="#263238" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="73,31 78,18 65,25" fill="#FF80AB"/>
  <!-- Eyes -->
  <ellipse cx="40" cy="48" rx="3.5" ry="4" fill="#263238"/>
  <circle cx="39" cy="46" r="1.2" fill="#FFFFFF"/>
  <ellipse cx="60" cy="48" rx="3.5" ry="4" fill="#263238"/>
  <circle cx="59" cy="46" r="1.2" fill="#FFFFFF"/>
  <!-- Nose & Mouth -->
  <polygon points="50,53 48,51 52,51" fill="#FF80AB"/>
  <path d="M47,55 Q50,58 50,54 Q50,58 53,55" fill="none" stroke="#263238" stroke-width="2" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="28" y1="49" x2="16" y2="47" stroke="#263238" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="29" y1="53" x2="17" y2="54" stroke="#263238" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="72" y1="49" x2="84" y2="47" stroke="#263238" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="71" y1="53" x2="83" y2="54" stroke="#263238" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="33" cy="54" r="3.5" fill="#FFCDD2" opacity="0.8"/>
  <circle cx="67" cy="54" r="3.5" fill="#FFCDD2" opacity="0.8"/>
  <!-- Cute little paws -->
  <ellipse cx="38" cy="72" rx="6" ry="4.5" fill="#FFFFFF" stroke="#263238" stroke-width="2"/>
  <ellipse cx="62" cy="72" rx="6" ry="4.5" fill="#FFFFFF" stroke="#263238" stroke-width="2"/>
</svg>
