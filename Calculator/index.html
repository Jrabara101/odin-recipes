<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Calculator</h1>

    <div id="calculator">
      <div id="display">
        <div id="expression"></div>
        <div id="current">0</div>
      </div>

      <div id="keys">
        <button class="key action" data-action="clear">AC</button>
        <button class="key action" data-action="backspace">DEL</button>
        <button class="key operator" data-operator="÷">÷</button>
        <button class="key operator" data-operator="×">×</button>

        <button class="key digit" data-digit="7">7</button>
        <button class="key digit" data-digit="8">8</button>
        <button class="key digit" data-digit="9">9</button>
        <button class="key operator" data-operator="−">−</button>

        <button class="key digit" data-digit="4">4</button>
        <button class="key digit" data-digit="5">5</button>
        <button class="key digit" data-digit="6">6</button>
        <button class="key operator" data-operator="+">+</button>

        <button class="key digit" data-digit="1">1</button>
        <button class="key digit" data-digit="2">2</button>
        <button class="key digit" data-digit="3">3</button>
        <button class="key equals" data-action="equals">=</button>

        <button class="key digit zero" data-digit="0">0</button>
        <button class="key digit" data-action="decimal">.</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
